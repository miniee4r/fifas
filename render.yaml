services:
  - type: web
    name: fifa-smart-stadium-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in the Render dashboard for security
      - key: PYTHON_VERSION
        value: 3.10.0
